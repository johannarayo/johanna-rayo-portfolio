<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Task Parade | Recurring task tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF7FC; --surface:#FFFFFF; --surface-2:#F7EFFF; --ink:#3B2A55; --ink-soft:#7A6A95; --line:#EEDDF7;
  --pink:#FF8FC7; --pink-soft:#FFE6F3; --lilac:#A98BFF; --lilac-soft:#F0E9FF;
  --mint:#4FC497; --mint-soft:#DDF6EC; --butter:#F2B83B; --butter-soft:#FFF4D6;
  --red:#E2557A; --red-soft:#FFE1E8;
  --critter-line:#3B2A55;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#1C1530; --surface:#271E3F; --surface-2:#30264D; --ink:#F3EAFF; --ink-soft:#B9A9D6; --line:#3D3160;
  --pink-soft:#4A2645; --lilac-soft:#382C5E; --mint-soft:#1F3F38; --butter-soft:#43391F; --red-soft:#4D2131;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){
    --bg:#1C1530; --surface:#271E3F; --surface-2:#30264D; --ink:#F3EAFF; --ink-soft:#B9A9D6; --line:#3D3160;
    --pink-soft:#4A2645; --lilac-soft:#382C5E; --mint-soft:#1F3F38; --butter-soft:#43391F; --red-soft:#4D2131;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.5}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lilac);outline-offset:2px;border-radius:10px}

.app{max-width:1240px;margin:0 auto;padding:28px 20px 48px}
.top{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.brand{display:flex;gap:14px;align-items:center}
.brand-mark{width:58px;height:58px;flex:none}
h1{font-family:Fredoka,Nunito,sans-serif;font-weight:600;font-size:40px;line-height:1;margin:0;letter-spacing:-.5px}
.lede{margin:6px 0 0;color:var(--ink-soft);max-width:56ch}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.btn{border:2px solid var(--ink);background:var(--pink);color:#3B2A55;border-radius:999px;padding:7px 16px;font-family:Fredoka,Nunito,sans-serif;font-weight:500;font-size:15px;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .12s,box-shadow .12s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--lilac)}
.btn.small{padding:3px 11px;font-size:13px}
.btn .count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;margin-left:5px;border-radius:99px;background:var(--surface);font-size:12px;font-family:Nunito,sans-serif;font-weight:700;color:#3B2A55}

.switch{display:inline-flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;font-weight:700;padding:4px}
.switch-track{width:46px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.switch-track::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(59,42,85,.3);transition:transform .2s}
.switch[aria-checked="true"] .switch-track{background:var(--lilac)}
.switch[aria-checked="true"] .switch-track::after{transform:translateX(20px)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px}

.views{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 16px}
.views-label{font-weight:700;font-size:14px;color:var(--ink-soft);margin-right:2px}
.view-btn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 13px 3px 4px;cursor:pointer;font-weight:700;font-size:14px}
.view-btn .mini{width:26px;height:30px;flex:none}
.view-btn[aria-pressed="true"]{background:var(--lilac-soft);border-color:var(--lilac)}

.stats{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 22px;padding:0;list-style:none}
.stats li{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-size:14px;color:var(--ink-soft)}
.stats b{font-family:Fredoka,sans-serif;font-weight:600;font-size:18px;color:var(--ink)}
.stats .ico{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
@media (max-width:940px){.layout{grid-template-columns:1fr}}
.lanes{display:grid;gap:16px}
.side{display:grid;gap:16px}

.lane{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:18px 20px 14px;transition:border-color .3s}
.lane[data-health="done"]{border-color:var(--mint)}
.lane[data-health="risk"]{border-color:var(--butter)}
.lane[data-health="overdue"]{border-color:var(--red)}
.lane[data-health="approval"]{border-color:var(--lilac)}
.lane.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--pink)}30%{box-shadow:0 0 0 8px var(--pink-soft)}100%{box-shadow:0 0 0 0 transparent}}
.lane-head{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.lane-title{font-family:Fredoka,sans-serif;font-weight:500;font-size:21px;line-height:1.2;margin:0}
.lane-meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin:6px 0 0;font-size:14px;color:var(--ink-soft)}
.chip{background:var(--lilac-soft);color:var(--ink);padding:1px 10px;border-radius:99px;font-weight:700;font-size:13px}
.due{padding:1px 10px;border-radius:99px;font-weight:700;font-size:13px;background:var(--mint-soft);color:var(--ink)}
.due[data-health="risk"]{background:var(--butter-soft)}
.due[data-health="overdue"]{background:var(--red-soft);color:var(--red)}
.due[data-health="approval"]{background:var(--lilac-soft)}
.owner{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--critter-line);flex:none;display:inline-block}
.pill{flex:none;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap;background:var(--lilac-soft)}
.pill[data-state="idle"]{background:var(--butter-soft)}
.pill[data-state="done"]{background:var(--mint-soft)}
.pill[data-state="approval"]{background:var(--pink-soft)}
.now{margin:10px 0 0;font-size:15px;min-height:1.5em}

.track{position:relative;height:122px;margin:4px 0 6px}
.road{position:absolute;left:20px;right:20px;bottom:34px;height:10px;border-radius:99px;background:var(--lilac-soft);overflow:hidden}
.road-fill{height:100%;width:calc(var(--p) * 1%);background:repeating-linear-gradient(90deg,var(--pink) 0 14px,#FFB3D9 14px 22px);border-radius:99px;transition:width 1.2s linear}
.lane[data-health="done"] .road-fill{background:var(--mint)}
.stop{position:absolute;bottom:0;left:calc(20px + (100% - 40px) * var(--at) / 100);width:0}
.stop-dot{position:absolute;bottom:32px;left:-7px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--line);transition:background .3s,border-color .3s}
.stop.reached .stop-dot{background:var(--pink);border-color:var(--critter-line)}
.stop-label{position:absolute;bottom:4px;left:0;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:700;color:var(--ink-soft)}
.stop:first-of-type .stop-label{transform:translateX(-20px)}
.stop:last-of-type .stop-label{transform:translateX(-70%)}
.stop.reached .stop-label{color:var(--ink)}
.stop-flag{position:absolute;bottom:38px;left:-3px;width:24px;height:34px}

.critter{position:absolute;bottom:36px;width:56px;height:64px;padding:0;border:0;background:none;cursor:pointer;
  left:calc(20px + (100% - 40px) * var(--p) / 100 - 28px);transition:left 1.2s linear;z-index:2;border-radius:16px}
.critter-svg{width:100%;height:100%;display:block;overflow:visible;transition:transform .2s}
.face-left .critter-svg{transform:scaleX(-1)}
.critter-svg .body,.critter-svg .leg{transform-box:fill-box;transform-origin:50% 100%}
.eyes-closed,.eyes-happy,.nightcap,.sweat{display:none}
.is-sleeping .eyes-open,.is-done .eyes-open{display:none}
.is-sleeping .eyes-closed,.is-sleeping .nightcap,.is-done .eyes-happy{display:inline}
.lane[data-health="overdue"] .critter:not(.is-sleeping) .sweat,
.lane[data-health="risk"] .critter:not(.is-sleeping) .sweat{display:inline}

.is-walking .body{animation:bob .45s ease-in-out infinite}
.is-walking .leg-l{animation:step .45s ease-in-out infinite}
.is-walking .leg-r{animation:step .45s ease-in-out infinite .225s}
.is-working .body{animation:wiggle 1.6s ease-in-out infinite}
.is-waiting .body{animation:sway 2s ease-in-out infinite}
.is-sleeping .body{animation:breathe 3.2s ease-in-out infinite}
.is-done .body{animation:hop 1s ease-in-out infinite}
.critter.dance .body{animation:dance .7s ease-in-out 3}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes step{50%{transform:translateY(-4px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes breathe{50%{transform:scale(1.03,.95)}}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-10px)}}
@keyframes dance{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-10px) rotate(-12deg)}75%{transform:translateY(-10px) rotate(12deg)}}

.bubble{position:absolute;left:50%;top:-18px;transform:translateX(-50%);opacity:0;pointer-events:none;transition:opacity .25s;font-family:Fredoka,sans-serif;font-weight:600;color:var(--ink)}
.zzz{left:70%;display:flex;gap:1px;font-size:14px}
.zzz i{font-style:normal;animation:float 2.4s ease-in-out infinite;color:var(--lilac)}
.zzz i:nth-child(2){animation-delay:.4s;font-size:16px}
.zzz i:nth-child(3){animation-delay:.8s;font-size:19px}
.is-sleeping .zzz{opacity:1}
.dots{display:flex;gap:3px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:5px 7px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--lilac);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
.is-working .dots{opacity:1}
.ask{width:26px;height:26px;border-radius:50%;background:var(--surface);border:2px solid var(--lilac);display:grid;place-items:center;font-size:15px;animation:float 1.8s ease-in-out infinite}
.is-waiting .ask{opacity:1}
.hearts{color:var(--pink);font-size:20px;animation:float 1.6s ease-in-out infinite}
.is-done .hearts{opacity:1}
.poke{font-size:22px;color:var(--pink)}
.poked .poke{animation:pop .9s ease-out forwards}
.poked .zzz,.poked .dots,.poked .hearts,.poked .ask{opacity:0}
@keyframes float{0%,100%{transform:translate(-50%,0);opacity:.6}50%{transform:translate(-50%,-6px);opacity:1}}
.zzz i{animation-name:floatz}
@keyframes floatz{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-6px);opacity:1}}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes pop{0%{opacity:0;transform:translate(-50%,6px) scale(.5)}30%{opacity:1;transform:translate(-50%,-4px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-14px) scale(1)}}
.confetti{position:absolute;left:50%;top:40%;width:7px;height:7px;border-radius:2px;pointer-events:none;animation:burst 1s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}

.steps{list-style:none;margin:2px 0 12px;padding:12px 14px;border-radius:16px;background:var(--surface-2);display:grid;gap:6px}
.steps label{display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px;cursor:pointer}
.steps input{width:18px;height:18px;accent-color:#FF8FC7;margin:0;flex:none}
.steps li.done label{color:var(--ink-soft);text-decoration:line-through}
.steps li.cur label::after{content:"current";margin-left:auto;font-size:11px;font-weight:700;background:var(--pink-soft);padding:1px 8px;border-radius:99px;text-decoration:none}

.lane-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.foot-left{display:flex;flex-direction:column;gap:3px}
.progress-text{font-size:14px;color:var(--ink-soft);font-weight:700}
.hist{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-soft)}
.hist span{width:9px;height:9px;border-radius:50%;background:var(--mint)}
.hist span.late{background:var(--red)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions .btn{padding:5px 13px;font-size:14px}
.waiting{font-size:13px;font-weight:700;color:var(--ink-soft);background:var(--pink-soft);padding:5px 12px;border-radius:99px}

.panel{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:18px}
.panel h2{font-family:Fredoka,sans-serif;font-weight:500;font-size:20px;margin:0}
.panel .sub{margin:2px 0 12px;font-size:14px;color:var(--ink-soft)}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.panel ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.feed ul{max-height:420px;overflow:auto}
.feed li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4}
.feed li .dot{margin-top:4px}
.feed time{display:block;font-size:12px;color:var(--ink-soft)}
.att li{display:grid;grid-template-columns:28px 1fr;gap:8px;font-size:14px;line-height:1.4;padding:10px;border-radius:16px;background:var(--surface-2)}
.att-ico{font-size:18px;line-height:1.2}
.att p{margin:0 0 6px}
.att-actions{display:flex;gap:6px;flex-wrap:wrap}
.team-row{width:100%;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;text-align:left;background:none;border:2px solid transparent;border-radius:16px;padding:6px 8px;cursor:pointer}
.team-row:hover{border-color:var(--line);background:var(--surface-2)}
.team-row .mini{width:34px;height:38px}
.team-row small{display:block;color:var(--ink-soft);font-size:13px}
.kud{font-weight:700;font-size:14px}
.week li{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:8px 10px;border-radius:12px;background:var(--surface-2)}
.week li b{font-family:Fredoka,sans-serif;font-weight:500}
.empty{color:var(--ink-soft);font-size:14px;margin:0}

/* notes drawer */
.overlay{position:fixed;inset:0;background:rgba(40,25,70,.3);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:2px solid var(--line);z-index:21;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.drawer-head{display:flex;gap:12px;align-items:center;padding:16px 18px;border-bottom:2px solid var(--line)}
.drawer-head .avatar{width:46px;height:52px;flex:none}
.drawer-head h2{font-family:Fredoka,sans-serif;font-weight:500;font-size:18px;margin:0;line-height:1.2}
.drawer-head p{margin:2px 0 0;font-size:13px;color:var(--ink-soft)}
.close{margin-left:auto;width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px;line-height:1;flex:none}
.thread{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.msg{max-width:84%;display:flex;gap:8px;align-items:flex-end}
.msg .bubble-text{padding:9px 13px;border-radius:18px;font-size:15px;line-height:1.4;overflow-wrap:anywhere}
.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.msg.mine .bubble-text{background:var(--pink-soft);border-bottom-right-radius:6px}
.msg.theirs .bubble-text{background:var(--surface);border:2px solid var(--line);border-bottom-left-radius:6px}
.msg .mini{width:30px;height:34px;flex:none}
.msg .tag{display:block;font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:2px}
.msg time{display:block;font-size:11px;color:var(--ink-soft);margin-top:3px}
.typing .bubble-text{display:flex;gap:4px;padding:12px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--lilac);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
.composer{border-top:2px solid var(--line);padding:12px 16px 16px;display:grid;gap:10px}
.tags{display:flex;gap:6px}
.tag-btn{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700;cursor:pointer}
.tag-btn[aria-pressed="true"]{background:var(--lilac-soft);border-color:var(--lilac)}
.compose-row{display:flex;gap:8px}
.compose-row textarea{flex:1;resize:none;height:46px;border:2px solid var(--line);border-radius:16px;padding:10px 12px;font:inherit;font-size:15px;background:var(--surface);color:var(--ink)}
.compose-row textarea:focus{outline:none;border-color:var(--lilac)}
.hint{margin:0;font-size:12px;color:var(--ink-soft)}

dialog{border:2px solid var(--line);border-radius:24px;padding:0;background:var(--surface);color:var(--ink);width:min(460px,calc(100% - 32px))}
dialog::backdrop{background:rgba(40,25,70,.35)}
.dialog-body{padding:22px;display:grid;gap:14px}
.dialog-body h2{font-family:Fredoka,sans-serif;font-weight:500;margin:0;font-size:22px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:grid;gap:4px;font-weight:700;font-size:14px}
label small{font-weight:400;color:var(--ink-soft)}
label.check{display:flex;align-items:center;gap:8px}
label.check input{accent-color:#FF8FC7;width:18px;height:18px}
input,select,.dialog-body textarea{font:inherit;font-weight:400;border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--surface);color:var(--ink)}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot-note{margin-top:28px;font-size:13px;color:var(--ink-soft);text-align:center}

@media (max-width:560px){
  h1{font-size:32px}
  .stop-label{font-size:11px}
  .lane{padding:16px 14px 12px}
  .row2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
  .is-sleeping .zzz,.is-working .dots,.is-done .hearts,.is-waiting .ask{opacity:1}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="brand-mark is-working" id="brandMark"></div>
      <div>
        <h1>Task Parade</h1>
        <p class="lede" id="lede"></p>
      </div>
    </div>
    <div class="controls">
      <button class="switch" id="autoBtn" role="switch" aria-checked="true"><span class="switch-track"></span>Auto-run</button>
      <button class="icon-btn" id="themeBtn" aria-label="Switch to dark mode">🌙</button>
      <button class="btn" id="addBtn">Add task</button>
      <button class="btn ghost" id="resetBtn">Reset demo</button>
    </div>
  </header>

  <nav class="views" id="views" aria-label="Choose whose view to see"></nav>
  <ul class="stats" id="stats" aria-live="polite"></ul>

  <div class="layout">
    <main class="lanes" id="lanes" aria-label="Tasks"></main>
    <aside class="side" id="side"></aside>
  </div>

  <p class="foot-note">Tip: poke a sleeping helper to wake them up, tick steps to move a task forward, or open Notes to leave a message.</p>
</div>

<div class="overlay" id="overlay"></div>
<section class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawerTitle">
  <div class="drawer-head">
    <div class="avatar" id="drawerAvatar"></div>
    <div>
      <h2 id="drawerTitle">Notes</h2>
      <p id="drawerSub"></p>
    </div>
    <button class="close" id="closeDrawer" aria-label="Close notes">×</button>
  </div>
  <div class="thread" id="thread" aria-live="polite"></div>
  <div class="composer">
    <div class="tags" role="group" aria-label="Message type">
      <button class="tag-btn" data-tag="note" aria-pressed="true">Note</button>
      <button class="tag-btn" data-tag="update" aria-pressed="false">Update</button>
      <button class="tag-btn" data-tag="blocker" aria-pressed="false">Blocker</button>
    </div>
    <div class="compose-row">
      <textarea id="msgInput" placeholder="Write a note…" aria-label="Message"></textarea>
      <button class="btn" id="sendBtn">Send</button>
    </div>

  </div>
</section>

<dialog id="addDialog">
  <form class="dialog-body" id="addForm">
    <h2>Add a recurring task</h2>
    <label>Task name<input id="fTitle" required maxlength="60" placeholder="Weekly inbox cleanup"></label>
    <div class="row2">
      <label>Who’s in charge<select id="fOwner"></select></label>
      <label>How often<select id="fCadence"><option>Daily</option><option selected>Weekly</option><option>Biweekly</option><option>Monthly</option></select></label>
    </div>
    <label>First due date<input type="date" id="fDue" required></label>
    <label>Steps <small>One per line. Leave empty for default steps.</small><textarea id="fSteps" rows="4"></textarea></label>
    <label class="check"><input type="checkbox" id="fApproval"> Needs manager sign-off before it counts as done</label>
    <div class="dialog-actions">
      <button type="button" class="btn ghost" id="cancelAdd">Cancel</button>
      <button type="submit" class="btn">Add task</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
const CHARS = {
  mimi:  {name:'Mimi',  species:'bunny', color:'#FFB8DA'},
  lulu:  {name:'Lulu',  species:'bear',  color:'#CDB8FF'},
  poppy: {name:'Poppy', species:'kitty', color:'#F2B0E6'},
  kiko:  {name:'Kiko',  species:'lamb',  color:'#FFD6EC'},
  nori:  {name:'Nori',  species:'seal',  color:'#D9CCFF'}
};
const STOPS = [{at:0,label:'Start'},{at:35,label:'In progress'},{at:70,label:'Review'},{at:100,label:'Done'}];
const NAP_REASONS = ['Waiting on approval','Waiting for a reply','Needs more info','On a lunch break'];
const DAY = 86400000, HOUR = 3600000;
const CADENCE = {Daily:DAY, Weekly:7*DAY, Biweekly:14*DAY, Monthly:30*DAY};
const KEY = 'task-parade-v2', THEME_KEY = 'task-parade-theme';
const LINE = '#3B2A55';
const REPLIES = {
  note:    ['Noted! I’ll keep that in mind 💜','Got it, it’s on my clipboard now.','Thanks! I’ll remember that.'],
  update:  ['Thanks for the update! Moving along 🐾','Yay, that helps a lot!','Perfect, back to it!'],
  blocker: ['Oh no. I’ll nap here until it’s sorted 💤','Pausing until this gets unblocked.','Okay, I’ll wait right here.']
};

let S, auto = true, current = null, curTag = 'note';
const timers = {}, openSteps = new Set(), cache = {};
const $ = s => document.querySelector(s);
const pick = a => a[Math.floor(Math.random()*a.length)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = t => new Date(t).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
const dateStr = t => new Date(t).toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'});
const rel = ms => { const h = ms/HOUR; return h < 1 ? 'under an hour' : h < 24 ? Math.round(h)+'h' : Math.round(h/24)+'d'; };
const ago = m => Date.now() - m*60000;
const isMgr = () => S.view === 'manager';
const setHTML = (el, key, html) => { if (cache[key] !== html){ cache[key] = html; el.innerHTML = html; } };

/* ---------- characters ---------- */
function critterSVG(c){
  const col = c.color, s = 'stroke="'+LINE+'" stroke-width="2"';
  let back = '', front = '', bodyRx = 22;
  if (c.species === 'bunny'){
    back = `<ellipse cx="23" cy="14" rx="5.5" ry="13" fill="${col}" ${s} transform="rotate(-10 23 14)"/>
            <ellipse cx="23" cy="15" rx="2.4" ry="8" fill="#FF8FC7" opacity=".45" transform="rotate(-10 23 15)"/>
            <ellipse cx="41" cy="14" rx="5.5" ry="13" fill="${col}" ${s} transform="rotate(10 41 14)"/>
            <ellipse cx="41" cy="15" rx="2.4" ry="8" fill="#FF8FC7" opacity=".45" transform="rotate(10 41 15)"/>`;
  } else if (c.species === 'bear'){
    back = `<circle cx="14" cy="23" r="7.5" fill="${col}" ${s}/><circle cx="14" cy="23" r="3.5" fill="#FF8FC7" opacity=".45"/>
            <circle cx="50" cy="23" r="7.5" fill="${col}" ${s}/><circle cx="50" cy="23" r="3.5" fill="#FF8FC7" opacity=".45"/>`;
    front = `<ellipse cx="32" cy="44" rx="7" ry="5" fill="#fff" opacity=".55"/>`;
  } else if (c.species === 'kitty'){
    back = `<path d="M12 30 L15 9 L29 21 Z" fill="${col}" ${s} stroke-linejoin="round"/>
            <path d="M52 30 L49 9 L35 21 Z" fill="${col}" ${s} stroke-linejoin="round"/>`;
    front = `<path d="M9 40 h6 M9 44 h6 M49 40 h6 M49 44 h6" stroke="${LINE}" stroke-width="1.4" stroke-linecap="round" opacity=".5"/>`;
  } else if (c.species === 'lamb'){
    back = `<ellipse cx="10" cy="34" rx="7" ry="3.5" fill="${col}" ${s} transform="rotate(20 10 34)"/>
            <ellipse cx="54" cy="34" rx="7" ry="3.5" fill="${col}" ${s} transform="rotate(-20 54 34)"/>`;
    front = `<g fill="#FFF3FA" ${s}><circle cx="20" cy="23" r="6"/><circle cx="28" cy="19" r="6.5"/><circle cx="37" cy="19" r="6.5"/><circle cx="45" cy="23" r="6"/></g>`;
  } else if (c.species === 'seal'){
    bodyRx = 24;
    back = `<ellipse cx="9" cy="47" rx="6" ry="3.5" fill="${col}" ${s} transform="rotate(30 9 47)"/>
            <ellipse cx="55" cy="47" rx="6" ry="3.5" fill="${col}" ${s} transform="rotate(-30 55 47)"/>`;
    front = `<circle cx="32" cy="41" r="1.6" fill="${LINE}"/>`;
  }
  return `<svg viewBox="0 0 64 64" class="critter-svg" aria-hidden="true">
    <ellipse cx="32" cy="61.5" rx="15" ry="2.4" fill="${LINE}" opacity=".12"/>
    <ellipse class="leg leg-l" cx="24" cy="56" rx="5" ry="3.8" fill="${col}" ${s}/>
    <ellipse class="leg leg-r" cx="40" cy="56" rx="5" ry="3.8" fill="${col}" ${s}/>
    <g class="body">
      ${back}
      <ellipse cx="32" cy="38" rx="${bodyRx}" ry="19" fill="${col}" ${s}/>
      ${front}
      <g class="eyes-open"><circle cx="24" cy="37" r="2.9" fill="${LINE}"/><circle cx="25" cy="36" r=".95" fill="#fff"/>
        <circle cx="40" cy="37" r="2.9" fill="${LINE}"/><circle cx="41" cy="36" r=".95" fill="#fff"/></g>
      <g class="eyes-closed" fill="none" stroke="${LINE}" stroke-width="1.8" stroke-linecap="round"><path d="M21 37 q3 2.6 6 0"/><path d="M37 37 q3 2.6 6 0"/></g>
      <g class="eyes-happy" fill="none" stroke="${LINE}" stroke-width="1.8" stroke-linecap="round"><path d="M21 38 q3 -3.2 6 0"/><path d="M37 38 q3 -3.2 6 0"/></g>
      <ellipse cx="18.5" cy="43" rx="3.4" ry="2" fill="#FF8FC7" opacity=".55"/>
      <ellipse cx="45.5" cy="43" rx="3.4" ry="2" fill="#FF8FC7" opacity=".55"/>
      <path d="M29 42.5 q1.5 1.7 3 0 q1.5 1.7 3 0" fill="none" stroke="${LINE}" stroke-width="1.5" stroke-linecap="round"/>
      <path class="sweat" d="M51 26 q4 6 0 8 q-4 -2 0 -8z" fill="#9FD8FF" stroke="${LINE}" stroke-width="1.5"/>
      <g class="nightcap"><path d="M15 27 Q31 17 47 23 Q52 12 58 9 Q38 4 15 27 Z" fill="#A98BFF" ${s} stroke-linejoin="round"/>
        <circle cx="58" cy="9" r="3.6" fill="#fff" ${s}/></g>
    </g>
  </svg>`;
}
const MANAGER_SVG = `<svg viewBox="0 0 64 64" class="critter-svg" aria-hidden="true">
  <circle cx="32" cy="38" r="21" fill="#FFE6A8" stroke="${LINE}" stroke-width="2"/>
  <path d="M18 22 L21 9 L27 17 L32 6 L37 17 L43 9 L46 22 Z" fill="#FFC94D" stroke="${LINE}" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="25" cy="38" r="2.8" fill="${LINE}"/><circle cx="39" cy="38" r="2.8" fill="${LINE}"/>
  <ellipse cx="19.5" cy="44" rx="3.4" ry="2" fill="#FF8FC7" opacity=".55"/><ellipse cx="44.5" cy="44" rx="3.4" ry="2" fill="#FF8FC7" opacity=".55"/>
  <path d="M28 45 q4 3.5 8 0" fill="none" stroke="${LINE}" stroke-width="1.8" stroke-linecap="round"/></svg>`;
const FLAG = `<svg class="stop-flag" viewBox="0 0 24 34" aria-hidden="true"><path d="M4 2 V33" stroke="${LINE}" stroke-width="2" stroke-linecap="round"/><path d="M5 3 L21 8 L5 14 Z" fill="#FF8FC7" stroke="${LINE}" stroke-width="2" stroke-linejoin="round"/></svg>`;
const avatar = who => who === 'manager' ? MANAGER_SVG : critterSVG(CHARS[who]);
const nameOf = who => who === 'manager' ? 'Manager' : CHARS[who].name;

/* ---------- state ---------- */
function seed(){
  const now = Date.now();
  const T = (id,title,owner,cadence,progress,state,steps,extra={}) =>
    Object.assign({id,title,owner,cadence,progress,state,steps,cycle:1,notes:[],idleReason:null,idleLeft:0,doneTicks:0,
      approvalTicks:0,needsApproval:false,kudos:0,history:[],dueAt:now+3*DAY,faceLeft:false}, extra);
  return {
    view:'manager', finished:0,
    tasks:[
      T('t1','Weekly facilitator schedule sync','mimi','Weekly',48,'active',
        ['Collect availability forms','Match people to sessions','Resolve conflicts','Send calendar invites','Confirm replies'],
        {cycle:12, kudos:3, dueAt:now+2*DAY, history:[true,true,true,false,true,true],
         notes:[{from:'manager',tag:'note',text:'Prioritize the Saturday cohorts this week.',t:ago(90)},{from:'mimi',tag:'note',text:'On it! Saturdays first 🐰',t:ago(89)}]}),
      T('t2','Monthly timesheet and invoice review','lulu','Monthly',22,'idle',
        ['Gather timesheets','Check hours against the schedule','Flag discrepancies','Prepare invoice summary','Send for approval'],
        {cycle:4, kudos:1, needsApproval:true, idleReason:'Blocked: two timesheets still missing', idleLeft:-1, dueAt:now-DAY, history:[true,true,false,true],
         notes:[{from:'lulu',tag:'blocker',text:'Two facilitators haven’t sent their timesheets yet.',t:ago(40)},{from:'manager',tag:'update',text:'I’ll follow up with them today.',t:ago(30)}]}),
      T('t3','Session attendance report','poppy','Weekly',100,'approval',
        ['Export attendance','Clean up the data','Spot drop-off trends','Write the summary','Share with the program lead'],
        {cycle:12, kudos:5, needsApproval:true, dueAt:now+8*HOUR, history:[true,true,true,true,true,true]}),
      T('t4','New-hire onboarding packets','kiko','Biweekly',100,'done',
        ['Pull the new-hire list','Prepare the welcome kit','Set up tool accounts','Book orientation call','Send the packet'],
        {cycle:6, kudos:2, dueAt:now+DAY, history:[true,true,true,true,false,true]}),
      T('t5','Social content calendar','nori','Weekly',15,'active',
        ['Brainstorm themes','Draft captions','Design graphics','Schedule posts','Review engagement'],
        {cycle:12, dueAt:now+14*HOUR, history:[true,false,true,true,true,true]})
    ],
    log:[
      {t:ago(2), owner:'poppy', text:'sent “Session attendance report” for sign-off'},
      {t:ago(3), owner:'kiko', text:'finished “New-hire onboarding packets” 🎉'},
      {t:ago(40), owner:'lulu', text:'is napping: blocked, two timesheets still missing'},
      {t:ago(60), owner:'nori', text:'started cycle 12 of “Social content calendar”'}
    ]
  };
}
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw){ S = JSON.parse(raw); return; } } catch(e){}
  S = seed();
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
const task = id => S.tasks.find(t => t.id === id);
const visible = () => isMgr() ? S.tasks : S.tasks.filter(t => t.owner === S.view);
const stageOf = p => p >= 100 ? 'Done' : p >= 70 ? 'Review' : p >= 35 ? 'In progress' : 'Start';
const stepIdx = t => Math.min(t.steps.length-1, Math.floor(t.progress/100*t.steps.length + 1e-9));
function health(t){
  if (t.state === 'done') return 'done';
  if (t.state === 'approval') return 'approval';
  const left = t.dueAt - Date.now();
  if (left < 0) return 'overdue';
  if ((left < DAY && t.progress < 70) || (t.state === 'idle' && left < 2*DAY)) return 'risk';
  return 'ok';
}
function dueLabel(t){
  const left = t.dueAt - Date.now();
  if (t.state === 'done') return 'Next due ' + dateStr(t.dueAt + CADENCE[t.cadence]);
  if (left < 0) return 'Overdue by ' + rel(-left);
  if (left < DAY) return 'Due in ' + rel(left);
  return 'Due ' + dateStr(t.dueAt);
}
const onTimeRate = hist => hist.length ? Math.round(hist.filter(Boolean).length / hist.length * 100) : null;

/* ---------- lanes ---------- */
function buildLane(t){
  const c = CHARS[t.owner];
  const el = document.createElement('article');
  el.className = 'lane'; el.dataset.id = t.id;
  el.innerHTML = `
    <div class="lane-head">
      <div>
        <h3 class="lane-title">${esc(t.title)}</h3>
        <p class="lane-meta"><span class="chip">${esc(t.cadence)}</span><span class="due"></span>
          <span class="owner"><span class="dot" style="background:${c.color}"></span>${c.name} the ${c.species}</span>
          <span class="cycle"></span></p>
      </div>
      <span class="pill"></span>
    </div>
    <p class="now"></p>
    <div class="track">
      <div class="road"><div class="road-fill"></div></div>
      ${STOPS.map(s => `<div class="stop" data-at="${s.at}" style="--at:${s.at}">${s.at===100 ? FLAG : '<span class="stop-dot"></span>'}<span class="stop-label">${s.label}</span></div>`).join('')}
      <button class="critter" type="button" aria-label="Poke ${c.name}">
        <span class="bubble zzz" aria-hidden="true"><i>z</i><i>z</i><i>Z</i></span>
        <span class="bubble dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="bubble ask" aria-hidden="true">?</span>
        <span class="bubble hearts" aria-hidden="true">♥</span>
        <span class="bubble poke" aria-hidden="true"></span>
        ${critterSVG(c)}
      </button>
    </div>
    <ul class="steps" hidden></ul>
    <div class="lane-foot">
      <div class="foot-left"><span class="progress-text"></span><span class="hist"></span></div>
      <div class="actions"></div>
    </div>`;
  return el;
}
const laneEl = t => document.querySelector(`.lane[data-id="${t.id}"]`);
function updateLane(t){
  const el = laneEl(t); if (!el) return;
  const c = CHARS[t.owner], h = health(t), n = t.steps.length, i = stepIdx(t);
  el.dataset.health = h;
  el.style.setProperty('--p', t.progress);
  const vis = t.state === 'idle' ? 'sleeping' : t.state === 'done' ? 'done' : t.state === 'approval' ? 'waiting' : (timers[t.id] ? 'walking' : 'working');
  const cr = el.querySelector('.critter');
  cr.classList.remove('is-walking','is-working','is-sleeping','is-done','is-waiting');
  cr.classList.add('is-'+vis);
  cr.classList.toggle('face-left', !!t.faceLeft);
  const pill = el.querySelector('.pill');
  pill.dataset.state = t.state;
  pill.textContent = t.state === 'idle' ? 'Napping' : t.state === 'done' ? 'Done' : t.state === 'approval' ? 'Needs sign-off' : stageOf(t.progress);
  const due = el.querySelector('.due');
  due.dataset.health = h; due.textContent = dueLabel(t);
  el.querySelector('.cycle').textContent = `Cycle ${t.cycle}`;
  setHTML(el.querySelector('.now'), t.id+'now',
    t.state === 'idle' ? `💤 <strong>Paused:</strong> ${esc(t.idleReason)}` :
    t.state === 'done' ? `✨ All ${n} steps finished. ${c.name} starts the next cycle soon.` :
    t.state === 'approval' ? `✋ All steps finished. ${c.name} is waiting for the manager to sign off.` :
    `<strong>Now:</strong> ${esc(t.steps[i])}`);
  el.querySelector('.progress-text').textContent =
    t.state === 'done' ? 'Complete, 100%' : t.state === 'approval' ? `All ${n} steps done` : `Step ${i+1} of ${n}, ${Math.round(t.progress)}%`;
  const recent = t.history.slice(-6), rate = onTimeRate(t.history);
  setHTML(el.querySelector('.hist'), t.id+'hist', recent.length
    ? `Last ${recent.length} cycles ${recent.map(ok => `<span class="${ok?'':'late'}" title="${ok?'On time':'Late'}"></span>`).join('')} ${rate}% on time`
    : 'First cycle');

  const locked = t.state === 'done' || t.state === 'approval';
  const doneCount = locked ? n : Math.floor(t.progress/100*n + 1e-9);
  const stepsEl = el.querySelector('.steps');
  stepsEl.hidden = !openSteps.has(t.id);
  setHTML(stepsEl, t.id+'steps', t.steps.map((s, k) =>
    `<li class="${k < doneCount ? 'done' : ''} ${k === doneCount && t.state === 'active' ? 'cur' : ''}"><label><input type="checkbox" data-step="${k}" ${k < doneCount ? 'checked' : ''} ${locked ? 'disabled' : ''}>${esc(s)}</label></li>`).join(''));

  let a = '';
  if (t.state === 'approval'){
    a += isMgr() ? `<button class="btn" data-act="approve">Approve</button><button class="btn ghost" data-act="sendback">Send back</button>`
                 : `<span class="waiting">Waiting for sign-off</span>`;
  } else if (t.state !== 'done'){
    a += `<button class="btn ghost" data-act="pause">${t.state === 'idle' ? 'Wake up' : 'Pause'}</button>`;
  }
  if (isMgr()) a += `<button class="btn ghost" data-act="kudos" aria-label="Send kudos to ${c.name}">⭐ ${t.kudos}</button>`;
  else if (t.kudos) a += `<span class="waiting" title="Kudos received">⭐ ${t.kudos}</span>`;
  a += `<button class="btn ghost" data-act="steps" aria-expanded="${openSteps.has(t.id)}">Steps</button>`;
  a += `<button class="btn" data-act="notes">Notes<span class="count">${t.notes.length}</span></button>`;
  setHTML(el.querySelector('.actions'), t.id+'act', a);
  el.querySelectorAll('.stop').forEach(s => s.classList.toggle('reached', t.progress >= +s.dataset.at));
}

/* ---------- task actions ---------- */
function log(t, text){
  S.log.unshift({t:Date.now(), owner:t.owner, text});
  S.log = S.log.slice(0, 50);
}
function markWalking(t){
  clearTimeout(timers[t.id]);
  timers[t.id] = setTimeout(() => { delete timers[t.id]; t.faceLeft = false; updateLane(t); }, 1250);
}
function moveTo(t, p){
  const old = t.progress;
  p = Math.max(0, Math.min(100, p));
  if (p === old) return;
  t.faceLeft = p < old; t.progress = p;
  markWalking(t);
  if (p > old && p < 100 && stageOf(old) !== stageOf(p)) log(t, `moved “${t.title}” to ${stageOf(p)}`);
  if (p >= 100) reachEnd(t);
}
function reachEnd(t){
  if (t.needsApproval){
    t.state = 'approval'; t.approvalTicks = 0;
    log(t, `sent “${t.title}” for sign-off`);
  } else finish(t);
}
function finish(t){
  const onTime = Date.now() <= t.dueAt;
  t.state = 'done'; t.doneTicks = 0; S.finished++;
  t.history.push(onTime); t.history = t.history.slice(-8);
  log(t, `finished “${t.title}”${onTime ? '' : ' (late)'} 🎉`);
  setTimeout(() => confetti(t), 600);
}
function newCycle(t){
  t.cycle++; t.state = 'active'; t.doneTicks = 0;
  t.dueAt += CADENCE[t.cadence];
  if (t.dueAt < Date.now()) t.dueAt = Date.now() + CADENCE[t.cadence];
  moveTo(t, 0);
  log(t, `started cycle ${t.cycle} of “${t.title}”`);
}
function nap(t, reason, ticks){
  t.state = 'idle'; t.idleReason = reason; t.idleLeft = ticks;
  log(t, `is napping: ${reason.charAt(0).toLowerCase() + reason.slice(1).replace(':', ',')}`);
}
function wake(t, msg){
  t.state = 'active'; t.idleReason = null; t.idleLeft = 0;
  log(t, msg || 'woke up and got back to work');
}
function approve(t, byDemo){
  log(t, byDemo ? `“${t.title}” was signed off` : `“${t.title}” was approved by the manager`);
  finish(t);
}
function sendBack(t){
  const n = t.steps.length;
  t.state = 'active';
  moveTo(t, Math.floor((n-1)/n*100));
  t.notes.push({from:'manager', tag:'update', text:'Sent back for a few changes. Details below.', t:Date.now()});
  log(t, `“${t.title}” was sent back for changes`);
}
function kudos(t){
  t.kudos++;
  t.notes.push({from:'manager', tag:'note', text:'⭐ Kudos! Great work on this one.', t:Date.now()});
  log(t, 'got kudos from the manager ⭐');
  const cr = laneEl(t)?.querySelector('.critter');
  if (cr){ cr.classList.remove('dance'); void cr.offsetWidth; cr.classList.add('dance'); setTimeout(() => cr.classList.remove('dance'), 2200); }
  confetti(t);
  setTimeout(() => { t.notes.push({from:t.owner, tag:'note', text:'Aww, thank you!! 💖', t:Date.now()}); refresh(t); if (current === t.id) renderThread(); }, 1000);
}
function setStep(t, k, checked){
  const n = t.steps.length;
  if (t.state === 'idle') wake(t, 'picked the task back up');
  moveTo(t, Math.round((checked ? k+1 : k) / n * 100));
}
function confetti(t){
  const cr = laneEl(t)?.querySelector('.critter'); if (!cr) return;
  const cols = ['#FF8FC7','#A98BFF','#FFD66B','#7FD8B6','#FFB8DA'];
  for (let k = 0; k < 14; k++){
    const b = document.createElement('span');
    b.className = 'confetti';
    const a = Math.random()*Math.PI*2, d = 30 + Math.random()*35;
    b.style.setProperty('--dx', Math.cos(a)*d+'px');
    b.style.setProperty('--dy', (Math.sin(a)*d - 20)+'px');
    b.style.background = cols[k % cols.length];
    cr.appendChild(b);
    setTimeout(() => b.remove(), 1000);
  }
}
function poke(t, symbol){
  const cr = laneEl(t).querySelector('.critter');
  cr.querySelector('.poke').textContent = symbol;
  cr.classList.remove('poked'); void cr.offsetWidth; cr.classList.add('poked');
  setTimeout(() => cr.classList.remove('poked'), 900);
}
function refresh(t){ if (t) updateLane(t); renderStats(); renderSide(); save(); }

function tick(){
  S.tasks.forEach(t => {
    if (t.state === 'done'){
      if (++t.doneTicks >= 6) newCycle(t);
    } else if (t.state === 'approval'){
      if (++t.approvalTicks >= 12) approve(t, true);
    } else if (t.state === 'idle'){
      if (t.idleLeft > 0 && --t.idleLeft === 0) wake(t, 'is back from a nap');
    } else {
      if (Math.random() < 0.03 && t.progress > 5 && t.progress < 92) nap(t, pick(NAP_REASONS), 4 + Math.floor(Math.random()*4));
      else { const g = pick([0,0,2,3,4,6]); if (g) moveTo(t, t.progress + g); }
    }
    updateLane(t);
  });
  renderStats(); renderSide(); save();
}

/* ---------- header, stats, side panels ---------- */
function renderViews(){
  const btn = (key, label, svg) => `<button class="view-btn" data-view="${key}" aria-pressed="${S.view === key}"><span class="mini">${svg}</span>${label}</button>`;
  $('#views').innerHTML = `<span class="views-label">Viewing as</span>` + btn('manager', 'Manager', MANAGER_SVG) +
    Object.entries(CHARS).map(([k,c]) => btn(k, c.name, critterSVG(c))).join('');
  $('#lede').textContent = isMgr()
    ? 'Five recurring tasks, five little helpers. See what’s moving, what’s stuck and what needs your sign-off, all in one place.'
    : `Hi ${CHARS[S.view].name}! These are the tasks you own. Tick off steps as you go and leave a blocker if you get stuck.`;
}
function renderStats(){
  const ts = visible();
  const n = f => ts.filter(f).length;
  const rate = onTimeRate(ts.flatMap(t => t.history));
  setHTML($('#stats'), 'stats', `
    <li><span class="ico" style="background:var(--lilac-soft)">🐾</span><b>${n(t => t.state === 'active')}</b> working</li>
    <li><span class="ico" style="background:var(--butter-soft)">💤</span><b>${n(t => t.state === 'idle')}</b> napping</li>
    <li><span class="ico" style="background:var(--pink-soft)">✋</span><b>${n(t => t.state === 'approval')}</b> waiting for sign-off</li>
    <li><span class="ico" style="background:var(--red-soft)">⏰</span><b>${n(t => health(t) === 'overdue')}</b> overdue</li>
    <li><span class="ico" style="background:var(--mint-soft)">✨</span><b>${rate ?? 0}%</b> on time</li>`);
}
function attentionItems(){
  const order = {overdue:0, approval:1, idle:2, risk:3};
  return S.tasks.map(t => {
    const c = CHARS[t.owner], h = health(t), left = t.dueAt - Date.now();
    if (t.state === 'approval') return {t, kind:'approval', icon:'✋', text:`${c.name} is waiting for your sign-off on “${t.title}”.`, act:'approve', label:'Approve'};
    if (h === 'overdue') return {t, kind:'overdue', icon:'⏰', text:`“${t.title}” is overdue by ${rel(-left)}.${t.state === 'idle' ? ` ${c.name} is paused: ${t.idleReason}.` : ''}`, act:'notes', label:'Check in'};
    if (t.state === 'idle') return {t, kind:'idle', icon:'💤', text:`${c.name} is paused on “${t.title}”: ${t.idleReason}.`, act:'wake', label:'Wake up'};
    if (h === 'risk') return {t, kind:'risk', icon:'⚠️', text:`“${t.title}” is due in ${rel(left)} and only ${Math.round(t.progress)}% done.`, act:'notes', label:'Check in'};
    return null;
  }).filter(Boolean).sort((a,b) => order[a.kind] - order[b.kind]);
}
function feedHTML(){
  const entries = (isMgr() ? S.log : S.log.filter(e => e.owner === S.view)).slice(0, 20);
  return `<section class="panel feed"><h2>Activity</h2><p class="sub">${isMgr() ? 'What the team has been up to' : 'Your recent activity'}</p><ul>` +
    (entries.length ? entries.map(e => { const c = CHARS[e.owner] || CHARS.mimi;
      return `<li><span class="dot" style="background:${c.color}"></span><div><b>${c.name}</b> ${esc(e.text)}<time>${fmt(e.t)}</time></div></li>`; }).join('')
      : '<li class="empty">Nothing yet. Turn on auto-run to get things moving.</li>') + '</ul></section>';
}
function renderSide(){
  let html = '';
  if (isMgr()){
    const items = attentionItems();
    html += `<section class="panel att"><div class="panel-head"><div><h2>Needs your attention</h2><p class="sub">${items.length ? `${items.length} thing${items.length > 1 ? 's' : ''} to look at` : 'All clear'}</p></div>
      <button class="btn ghost small" data-side="report">Copy report</button></div><ul>` +
      (items.length ? items.map(it => `<li data-id="${it.t.id}"><span class="att-ico" aria-hidden="true">${it.icon}</span><div><p>${esc(it.text)}</p>
        <div class="att-actions"><button class="btn small" data-att="${it.act}">${it.label}</button><button class="btn ghost small" data-att="goto">View task</button></div></div></li>`).join('')
        : '<li><span class="att-ico">🌷</span><p class="empty">Nothing needs you right now.</p></li>') + '</ul></section>';
    html += `<section class="panel"><h2>Team</h2><p class="sub">Tap a helper to see their view</p><ul>` +
      Object.entries(CHARS).map(([k,c]) => {
        const ts = S.tasks.filter(t => t.owner === k); if (!ts.length) return '';
        const rate = onTimeRate(ts.flatMap(t => t.history));
        const napping = ts.filter(t => t.state === 'idle').length;
        return `<li><button class="team-row" data-view="${k}"><span class="mini">${critterSVG(c)}</span>
          <span><b>${c.name}</b><small>${ts.length} task${ts.length > 1 ? 's' : ''}${napping ? `, ${napping} paused` : ''}${rate !== null ? `, ${rate}% on time` : ''}</small></span>
          <span class="kud">⭐ ${ts.reduce((a,t) => a + t.kudos, 0)}</span></button></li>`;
      }).join('') + '</ul></section>';
  } else {
    const c = CHARS[S.view], mine = visible();
    const next = mine.filter(t => t.state !== 'done').sort((a,b) => a.dueAt - b.dueAt)[0];
    const rate = onTimeRate(mine.flatMap(t => t.history));
    html += `<section class="panel week"><h2>Your week, ${c.name}</h2><p class="sub">A quick look at what’s on your plate</p><ul>
      <li><span>Next up</span><b>${next ? `${esc(next.title)}, ${dueLabel(next).toLowerCase()}` : 'Nothing due'}</b></li>
      <li><span>Tasks you own</span><b>${mine.length}</b></li>
      <li><span>Paused</span><b>${mine.filter(t => t.state === 'idle').length}</b></li>
      <li><span>Waiting for sign-off</span><b>${mine.filter(t => t.state === 'approval').length}</b></li>
      <li><span>On-time rate</span><b>${rate ?? 0}%</b></li>
      <li><span>Kudos received</span><b>⭐ ${mine.reduce((a,t) => a + t.kudos, 0)}</b></li></ul></section>`;
  }
  html += feedHTML();
  setHTML($('#side'), 'side', html);
}
function renderAll(){
  Object.keys(cache).forEach(k => delete cache[k]);
  renderViews();
  const box = $('#lanes'); box.innerHTML = '';
  const ts = visible();
  if (!ts.length) box.innerHTML = '<section class="panel"><p class="empty">No tasks here yet. Use “Add task” to give this helper something to do.</p></section>';
  ts.forEach(t => { box.appendChild(buildLane(t)); updateLane(t); });
  renderStats(); renderSide();
}
function gotoTask(t){
  const el = laneEl(t); if (!el) return;
  el.scrollIntoView({behavior:'smooth', block:'center'});
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
function statusText(t){
  if (t.state === 'done') return 'Done';
  if (t.state === 'approval') return 'Waiting for sign-off';
  if (t.state === 'idle') return `Paused (${t.idleReason})`;
  return `${stageOf(t.progress)}, ${Math.round(t.progress)}%`;
}
function copyReport(){
  const items = attentionItems();
  const lines = [`Task Parade status report, ${dateStr(Date.now())}`, '',
    ...S.tasks.map(t => `- ${t.title} (${CHARS[t.owner].name}, ${t.cadence}): ${statusText(t)}. ${dueLabel(t)}.`), '',
    items.length ? 'Needs attention:' : 'Nothing needs attention right now.',
    ...items.map(it => `- ${it.text}`)];
  const text = lines.join('\n');
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Status report copied'); } catch(e){ toast('Copy didn’t work in this browser'); } ta.remove(); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast('Status report copied'), fallback); else fallback();
}
let toastTimer;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ---------- notes drawer ---------- */
function me(){ return isMgr() ? 'manager' : S.view; }
function openNotes(id, tag){
  const t = task(id); if (!t) return;
  current = id;
  const c = CHARS[t.owner];
  $('#drawerAvatar').innerHTML = isMgr() ? critterSVG(c) : MANAGER_SVG;
  $('#drawerTitle').textContent = t.title;
  $('#drawerSub').textContent = isMgr() ? `Chat with ${c.name} the ${c.species}` : 'Chat with your manager';
  $('#msgInput').placeholder = isMgr() ? `Write a note for ${c.name}…` : 'Write a note for your manager…';
  if (tag) setTag(tag);
  renderThread();
  $('#drawer').classList.add('open'); $('#drawer').setAttribute('aria-hidden','false');
  $('#overlay').classList.add('open');
  setTimeout(() => $('#msgInput').focus(), 300);
}
function closeNotes(){
  $('#drawer').classList.remove('open'); $('#drawer').setAttribute('aria-hidden','true');
  $('#overlay').classList.remove('open');
  const t = task(current); current = null;
  if (t) laneEl(t)?.querySelector('[data-act="notes"]')?.focus();
}
function renderThread(typingFrom){
  const t = task(current); if (!t) return;
  const label = {note:'Note', update:'Update', blocker:'Blocker'};
  const th = $('#thread');
  let html = t.notes.length ? t.notes.map(m => {
    const mine = m.from === me();
    return `<div class="msg ${mine ? 'mine' : 'theirs'}">${mine ? '' : `<div class="mini">${avatar(m.from)}</div>`}<div class="bubble-text">
      <span class="tag">${mine ? '' : nameOf(m.from) + ', '}${label[m.tag] || 'Note'}</span>${esc(m.text)}<time>${fmt(m.t)}</time></div></div>`;
  }).join('') : `<p class="empty">No notes yet. Leave a note, an update or a blocker.</p>`;
  if (typingFrom) html += `<div class="msg theirs typing"><div class="mini">${avatar(typingFrom)}</div><div class="bubble-text"><i></i><i></i><i></i></div></div>`;
  th.innerHTML = html;
  th.scrollTop = th.scrollHeight;
}
function setTag(tag){
  curTag = tag;
  document.querySelectorAll('.tag-btn').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.tag === tag)));
}
function send(){
  const input = $('#msgInput'), text = input.value.trim();
  const t = task(current);
  if (!text || !t) return;
  const tag = curTag, from = me();
  t.notes.push({from, tag, text, t:Date.now()});
  input.value = '';
  let reply = from === 'manager' ? pick(REPLIES[tag]) : null;
  if (tag === 'blocker' && t.state !== 'done' && t.state !== 'approval'){
    nap(t, 'Blocked: ' + (text.length > 48 ? text.slice(0, 48) + '…' : text), -1);
    if (from !== 'manager') toast('Blocker sent. Your manager will see it.');
  } else if (tag === 'update' && t.state === 'idle'){
    wake(t, 'got an update and woke up');
    if (reply) reply = 'Yay, I’m awake! Back to work 🌸';
  }
  refresh(t);
  if (!reply){ renderThread(); return; }
  renderThread(t.owner);
  setTimeout(() => {
    t.notes.push({from:t.owner, tag:'note', text:reply, t:Date.now()});
    refresh(t);
    if (current === t.id) renderThread();
  }, 900);
}

/* ---------- events ---------- */
$('#lanes').addEventListener('click', e => {
  const lane = e.target.closest('.lane'); if (!lane) return;
  const t = task(lane.dataset.id);
  if (e.target.closest('.critter')){
    if (t.state === 'idle'){ wake(t, 'got poked awake 👀'); poke(t, '!'); }
    else poke(t, '♥');
    return refresh(t);
  }
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (!act) return;
  if (act === 'notes') return openNotes(t.id);
  if (act === 'pause'){ if (t.state === 'idle') wake(t); else if (t.state === 'active') nap(t, 'Paused by ' + (isMgr() ? 'the manager' : CHARS[t.owner].name), -1); }
  if (act === 'approve' && t.state === 'approval') approve(t);
  if (act === 'sendback' && t.state === 'approval'){ sendBack(t); refresh(t); return openNotes(t.id, 'update'); }
  if (act === 'kudos') kudos(t);
  if (act === 'steps'){ openSteps.has(t.id) ? openSteps.delete(t.id) : openSteps.add(t.id); }
  refresh(t);
});
$('#lanes').addEventListener('change', e => {
  const box = e.target.closest('[data-step]'); if (!box) return;
  const t = task(e.target.closest('.lane').dataset.id);
  setStep(t, +box.dataset.step, box.checked);
  refresh(t);
});
$('#side').addEventListener('click', e => {
  if (e.target.closest('[data-side="report"]')) return copyReport();
  const vb = e.target.closest('[data-view]'); if (vb){ S.view = vb.dataset.view; save(); renderAll(); window.scrollTo({top:0, behavior:'smooth'}); return; }
  const b = e.target.closest('[data-att]'); if (!b) return;
  const t = task(b.closest('li').dataset.id);
  const act = b.dataset.att;
  if (act === 'goto') return gotoTask(t);
  if (act === 'notes') return openNotes(t.id);
  if (act === 'approve' && t.state === 'approval') approve(t);
  if (act === 'wake' && t.state === 'idle') wake(t, 'was woken up by the manager');
  refresh(t);
});
$('#views').addEventListener('click', e => {
  const b = e.target.closest('[data-view]'); if (!b) return;
  S.view = b.dataset.view; save(); renderAll();
});

$('#autoBtn').addEventListener('click', () => { auto = !auto; $('#autoBtn').setAttribute('aria-checked', String(auto)); });
function applyTheme(th){
  document.documentElement.dataset.theme = th;
  $('#themeBtn').textContent = th === 'dark' ? '☀️' : '🌙';
  $('#themeBtn').setAttribute('aria-label', th === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
}
$('#themeBtn').addEventListener('click', () => {
  const th = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(th); try { localStorage.setItem(THEME_KEY, th); } catch(e){}
});
$('#resetBtn').addEventListener('click', () => {
  try { localStorage.removeItem(KEY); } catch(e){}
  Object.keys(timers).forEach(k => { clearTimeout(timers[k]); delete timers[k]; });
  openSteps.clear(); S = seed(); renderAll(); toast('Demo reset');
});
$('#closeDrawer').addEventListener('click', closeNotes);
$('#overlay').addEventListener('click', closeNotes);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && current) closeNotes(); });
$('#sendBtn').addEventListener('click', send);
$('#msgInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
document.querySelectorAll('.tag-btn').forEach(b => b.addEventListener('click', () => setTag(b.dataset.tag)));

const dlg = $('#addDialog');
$('#fOwner').innerHTML = Object.entries(CHARS).map(([k,c]) => `<option value="${k}">${c.name} the ${c.species}</option>`).join('');
$('#addBtn').addEventListener('click', () => {
  $('#addForm').reset();
  if (!isMgr()) $('#fOwner').value = S.view;
  const d = new Date(Date.now() + 7*DAY);
  $('#fDue').value = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  dlg.showModal();
});
$('#fCadence').addEventListener('change', () => {
  const d = new Date(Date.now() + CADENCE[$('#fCadence').value]);
  $('#fDue').value = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
});
$('#cancelAdd').addEventListener('click', () => dlg.close());
$('#addForm').addEventListener('submit', e => {
  e.preventDefault();
  const title = $('#fTitle').value.trim(); if (!title) return;
  const steps = $('#fSteps').value.split('\n').map(s => s.trim()).filter(Boolean);
  const due = new Date($('#fDue').value + 'T17:00').getTime();
  const t = {id:'t'+Date.now(), title, owner:$('#fOwner').value, cadence:$('#fCadence').value, progress:0, state:'active',
    steps: steps.length ? steps : ['Plan it out','Do the work','Check it over','Wrap up'],
    cycle:1, notes:[], idleReason:null, idleLeft:0, doneTicks:0, approvalTicks:0, needsApproval:$('#fApproval').checked,
    kudos:0, history:[], dueAt: isNaN(due) ? Date.now() + CADENCE.Weekly : due, faceLeft:false};
  S.tasks.push(t);
  log(t, `picked up “${title}”`);
  dlg.close(); save(); renderAll();
  setTimeout(() => gotoTask(t), 50);
  toast('Task added');
});

/* ---------- start ---------- */
let savedTheme = 'light';
try { savedTheme = localStorage.getItem(THEME_KEY) || 'light'; } catch(e){}
applyTheme(savedTheme);
$('#brandMark').innerHTML = critterSVG(CHARS.mimi);
load(); renderAll();
setInterval(() => { if (auto && !document.hidden) tick(); }, 1400);
</script>
</body>
</html>
